name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.7-bookworm
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: support_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support -d support_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://support:ci-test-only@localhost:5432/support_test
      DATABASE_URL: postgresql+psycopg://support:ci-test-only@localhost:5432/support_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.14"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run --locked ruff format --check app tests migrations pyproject.toml
      - name: Lint
        run: uv run --locked ruff check app tests migrations pyproject.toml
      - name: Unit tests
        run: uv run --locked pytest tests/unit -q
      - name: Apply migrations and check model drift
        run: |
          uv run --locked alembic upgrade head
          uv run --locked alembic check
      - name: PostgreSQL integration
        run: uv run --locked pytest tests/integration -m postgres -q
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build distributions
        run: uv build --no-sources
      - name: Verify installed wheel
        shell: bash
        run: |
          uv venv .wheel-check
          uv pip install --python .wheel-check/bin/python dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.wheel-check/bin/python" -c "from app.main import create_app; assert callable(create_app)"
